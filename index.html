<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CraveBite | Fast & Fresh Food Delivery</title>
    <meta name="description" content="Discover top restaurants, artisan eats, gourmet burgers, fresh sushi, and hot pizzas delivered fast to your doorstep with live GPS tracking." />
    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cravebite_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#fbfaf8] dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 transition-colors duration-300">
    <div id="root" class="min-h-screen bg-[#fbfaf8] dark:bg-[#0b1120] text-slate-800 dark:text-slate-100"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
